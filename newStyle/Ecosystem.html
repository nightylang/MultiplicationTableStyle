<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaThana — Unified Ecosystem Hub</title>
  
  <!-- Premium Font Pair: Playfair Display for Editorial elegance, Inter for clean execution -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       EXPERT COLOR SCHEME TOKENS (DYNAMIC ARCHITECTURE)
       ========================================================================== */
    :root[data-theme="dark"] {
      --bg-base: #030712;
      --bg-canvas: #060b18;
      --surface-glass: rgba(10, 18, 36, 0.45);
      --border-glass: rgba(255, 255, 255, 0.05);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --brand-blue: #1e3a8a;
      --brand-red: #7f1d1d;
      --accent-red: #ef4444;
      --glow-core: radial-gradient(circle, rgba(30, 58, 138, 0.15) 0%, rgba(0,0,0,0) 70%);
      --glow-secondary: radial-gradient(circle, rgba(127, 29, 29, 0.1) 0%, rgba(0,0,0,0) 60%);
    }

    :root[data-theme="dark-red"] {
      --bg-base: #0a0202;
      --bg-canvas: #140505;
      --surface-glass: rgba(28, 8, 8, 0.5);
      --border-glass: rgba(239, 68, 68, 0.08);
      --text-main: #fef2f2;
      --text-muted: #fca5a5;
      --brand-blue: #172554;
      --brand-red: #991b1b;
      --accent-red: #dc2626;
      --glow-core: radial-gradient(circle, rgba(153, 27, 27, 0.25) 0%, rgba(0,0,0,0) 70%);
      --glow-secondary: radial-gradient(circle, rgba(23, 37, 84, 0.15) 0%, rgba(0,0,0,0) 60%);
    }

    /* Core Resets & Hardware Acceleration Layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    h1, h2, h3, h4, .editorial-font {
      font-family: 'Playfair Display', serif;
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
    }

    /* Ambient Lighting Mesh (Non-uniform layout decoration) */
    .ambient-mesh {
      position: absolute;
      width: 800px;
      height: 800px;
      top: -200px;
      right: -100px;
      background: var(--glow-core);
      pointer-events: none;
      z-index: 1;
    }
    
    .ambient-mesh-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      top: 120vh;
      left: -200px;
      background: var(--glow-secondary);
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================================
       NAVIGATION CONTROLLER
       ========================================================================== */
    .nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 90px;
      background: var(--surface-glass);
      border-bottom: 1px solid var(--border-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      z-index: 1000;
    }

    .nav-inner {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 0 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-block {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.04em;
    }
    .logo-block span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--accent-red);
    }

    .menu-list {
      display: flex;
      gap: 48px;
      list-style: none;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .menu-list a:hover {
      color: var(--accent-red);
    }

    /* Theme Engine Mod Interface Bubble */
    .controls-box {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .mode-switch {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-switch:hover {
      background: var(--text-main);
      color: var(--bg-base);
    }

    .cart-trigger-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-count-badge {
      background: var(--accent-red);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 100px;
    }

    /* ==========================================================================
       HERO EDITORIAL LAYOUT
       ========================================================================== */
    .hero-layout {
      min-height: 90vh;
      display: flex;
      align-items: center;
      padding: 140px 60px 60px 60px;
      position: relative;
      z-index: 2;
    }

    .hero-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 60px;
      align-items: center;
    }

    .hero-statement h1 {
      font-size: 4.8rem;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 32px;
    }

    .hero-statement p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 520px;
      line-height: 1.6;
    }

    /* Human-crafted asymmetrical interactive asset panel */
    .hero-abstract-panel {
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      border-radius: 4px;
      padding: 40px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 30px 60px rgba(0,0,0,0.2);
    }

    .panel-header {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent-red);
      font-weight: 700;
    }

    .panel-display {
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--text-main);
      margin: 40px 0;
    }

    .panel-cta {
      display: inline-block;
      border-bottom: 2px solid var(--text-main);
      padding-bottom: 4px;
      font-size: 0.9rem;
      font-weight: 600;
      align-self: flex-start;
      cursor: pointer;
    }

    /* ==========================================================================
       SUBSECTION: SECURE DIGITAL BANKING MODULE
       ========================================================================== */
    .dashboard-segment {
      max-width: 1400px;
      margin: 0 auto;
      padding: 60px 60px 120px 60px;
    }

    .bank-grid-wrapper {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
    }

    .bank-auth-shield {
      background: var(--surface-glass);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 40px;
      backdrop-filter: blur(20px);
    }

    .bank-auth-shield h3 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .auth-input-group {
      margin-bottom: 20px;
    }

    .auth-input-group label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .auth-input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-glass);
      padding: 14px;
      color: var(--text-main);
      font-family: inherit;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .auth-input-group input:focus {
      border-color: var(--accent-red);
    }

    .btn-action-trigger {
      width: 100%;
      background: var(--text-main);
      color: var(--bg-base);
      border: none;
      padding: 16px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .btn-action-trigger:hover {
      background-color: var(--accent-red);
      color: white;
    }

    .bank-ledger-preview {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ledger-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 24px;
    }

    .balance-metric-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
    }

    .balance-metric-value {
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 8px;
      letter-spacing: -0.02em;
    }

    .transaction-history-stack {
      margin-top: 32px;
    }

    .tx-item {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      font-size: 0.9rem;
     }
.tx-item:last-child { border: none; }
  .tx-desc { color: var(--text-main); 
font-weight: 500; }
.tx-meta { color: var(--text-muted); font-size: 0.8rem; }
.tx-amt { font-weight: 600; }
  .tx-amt.positive { color: #10b981; }
/* ==========================================================================
SUBSECTION: MOBILE ASSETS MARKETPLACE
========================================================================== */
.store-segment {background: var(--bg-canvas);padding: 120px 60px;border-top: 1px solid var(--border-glass);border-bottom: 1px solid var(--border-glass);}
.segment-container {max-width: 1400px;margin: 0 auto;}
.store-product-grid {display: grid;grid-template-columns: repeat(3, 1fr);gap: 30px;margin-top: 60px;}
.product-showcase-card {background: var(--surface-glass);border: 1px solid var(--border-glass);border-radius: 4px;overflow: hidden;display: flex;flex-direction: column;transition: all 0.3s ease;}
.product-showcase-card:hover {border-color: rgba(255,255,255,0.1);transform: translateY(-4px);}
.product-visual-placeholder {height: 240px;background: linear-gradient(135deg, rgba(255,255,255,0.01) 0%, rgba(255,255,255,0.03) 100%);display: flex;align-items: center;justify-content: center;position: relative;border-bottom: 1px solid var(--border-glass);}
.product-visual-placeholder::after {content: '';position: absolute;width: 80px;height: 140px;border: 1px solid rgba(255,255,255,0.1);border-radius: 8px;background: rgba(0,0,0,0.2);}
  .product-info-panel {padding: 32px;flex-grow: 1;display: flex;flex-direction: column;justify-content: space-between;}
.product-title-line {display: flex;justify-content: space-between;align-items: flex-start;margin-bottom: 12px;}
.product-title-line h4 {font-size: 1.4rem;color: var(--text-main);}
  .product-cost {font-weight: 600;font-size: 1.1rem;color: var(--text-main);}
.product-specs-list {list-style: none;font-size: 0.85rem;color: var(--text-muted);margin-bottom: 24px;}
.product-specs-list li {margin-bottom: 6px;display: flex;align-items: center;}
.product-specs-list li::before {content: '▪';color: var(--accent-red);margin-right: 8px;}
/* ==========================================================================
    SUBSECTION: PREMIUM REAL ESTATE PROPERTY RESIDENCIES
    ========================================================================== */
    .rent-house-segment {max-width: 1400px;margin: 0 auto;padding: 120px 60px;}
    .residence-asymmetric-row {display: grid;grid-template-columns: 1.3fr 0.7fr;gap: 40px;margin-top: 60px;}
    .residence-hero-card {background: var(--surface-glass);border: 1px solid var(--border-glass);padding: 60px;backdrop-filter: blur(20px);display: flex;flex-direction: column;justify-content: space-between;min-height: 460px;}
    .residence-tag {font-size: 0.75rem;text-transform: uppercase;letter-spacing: 0.2em;color: var(--accent-red);font-weight: 700;}
    .residence-meta-details h3 {font-size: 2.6rem;margin-bottom: 16px;line-height: 1.15;}
    .residence-meta-details p {color: var(--text-muted);max-width: 560px;font-size: 0.95rem;line-height: 1.6;}
    .residence-pricing-sidebar {background: rgba(255,255,255,0.01);border: 1px solid var(--border-glass);padding: 40px;display: flex;flex-direction: column;justify-content: space-between;}
    .price-tag-large {font-size: 2.8rem;font-weight: 700;color: var(--text-main);letter-spacing: -0.02em;}.price-tag-large span {font-size: 1rem;font-weight: 400;color: var(--text-muted);letter-spacing: 0;}
    .amenities-metric-box {border-top: 1px solid var(--border-glass);border-bottom: 1px solid var(--border-glass);padding: 24px 0;margin: 24px 0;}.amenity-row {display: flex;justify-content: space-between;font-size: 0.85rem;margin-bottom: 8px;}
    .amenity-row:last-child { margin: 0; }
    .amenity-label { color: var(--text-muted); }
    .amenity-value { color: var(--text-main); font-weight: 500; }
    /* ==========================================================================
    THE CHECKOUT FLYOUT GLASS DRAWER
    ========================================================================== */
    .cart-drawer-overlay {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(3, 7, 18, 0.4);backdrop-filter: blur(4px);-webkit-backdrop-filter: blur(4px);z-index: 2000;opacity: 0;pointer-events: none;transition: opacity 0.4s ease;}.cart-drawer-panel {position: fixed;top: 0;right: 0;width: 460px;height: 100%;background: var(--surface-glass);border-left: 1px solid var(--border-glass);backdrop-filter: blur(40px);-webkit-backdrop-filter: blur(40px);z-index: 2001;transform: translateX(100%);transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);padding: 40px;display: flex;flex-direction: column;justify-content: space-between;box-shadow: -20px 0 60px rgba(0,0,0,0.4);}body.drawer-active .cart-drawer-overlay { opacity: 1; pointer-events: auto; }body.drawer-active .cart-drawer-panel { transform: translateX(0); }.drawer-header {display: flex;justify-content: space-between;align-items: center;border-bottom: 1px solid var(--border-glass);padding-bottom: 20px;}.close-drawer-btn {background: none;border: none;color: var(--text-muted);cursor: pointer;font-size: 1.2rem;}.close-drawer-btn:hover { color: var(--text-main); }.drawer-items-container {flex-grow: 1;margin: 30px 0;overflow-y: auto;}
    .empty-cart-state {color: var(--text-muted);font-size: 0.9rem;text-align: center;margin-top: 40px;}
.cart-item-node {display: flex;justify-content: space-between;align-items: flex-start;background: rgba(255,255,255,0.01);border: 1px solid var(--border-glass);padding: 20px;border-radius: 4px;margin-bottom: 16px;}.item-node-meta h5 {font-size: 1.05rem;color: var(--text-main);margin-bottom: 4px;}.item-node-meta span {font-size: 0.75rem;text-transform: uppercase;letter-spacing: 0.05em;color: var(--accent-red);}.remove-node-item {background: none;border: none;color: var(--text-muted);cursor: pointer;font-size: 0.8rem;}.remove-node-item:hover { color: var(--accent-red); }.drawer-summary-block {border-top: 1px solid var(--border-glass);padding-top: 24px;}.summary-row-line {display: flex;justify-content: space-between;font-size: 1.1rem;font-weight: 600;color: var(--text-main);margin-bottom: 24px;}
/* ==========================================================================HUMAN-CENTRIC TEAM STRUCTURE MODULE========================================================================== */.team-layer {background: var(--bg-canvas);padding: 140px 60px;border-top: 1px solid var(--border-glass);}.team-container {max-width: 1400px;margin: 0 auto;}.team-split {display: grid;grid-template-columns: 0.8fr 1.2fr;gap: 80px;}.team-profile-container {display: grid;grid-template-columns: 1fr 1fr;gap: 40px;}.profile-node {border-left: 2px solid var(--brand-red);padding-left: 24px;}.profile-node h4 {font-size: 1.5rem;color: var(--text-main);margin-bottom: 4px;}.profile-node span {font-size: 0.8rem;text-transform: uppercase;letter-spacing: 0.1em;color: var(--text-muted);}
/* ==========================================================================FOOTER ECOSYSTEM BLOCK========================================================================== */.master-footer {border-top: 1px solid var(--border-glass);padding: 80px 60px 40px 60px;font-size: 0.85rem;}.footer-inner {max-width: 1400px;margin: 0 auto;display: flex;justify-content: space-between;align-items: center;}/* Responsive scaling optimizations */@media(max-width: 1024px) {.hero-container, .bank-grid-wrapper, .store-product-grid, .residence-asymmetric-row, .team-split {grid-template-columns: 1fr;}.hero-statement h1 { font-size: 3.5rem; }.cart-drawer-panel { width: 100%; }}
    </style>
